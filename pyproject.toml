[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchyard-codex-foreman"
version = "0.2.0"
description = "Source distribution of Switchyard's bounded direct provider runtime"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema[format]>=4.10"]

[project.scripts]
switchyard-direct-api = "switchyard.direct_api:main"
switchyard-provider-runner = "switchyard.provider_runner:main"
switchyard-review-verifier = "switchyard.review_verifier:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"switchyard" = ["schemas/*.json"]
"switchyard._vendor.rfc8785" = ["LICENSE", "VENDOR.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
