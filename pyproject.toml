[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchyard-codex-foreman"
version = "0.1.0"
description = "Source distribution of Switchyard's bounded direct provider runtime"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
switchyard-direct-api = "switchyard.direct_api:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"switchyard._vendor.rfc8785" = ["LICENSE", "VENDOR.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
